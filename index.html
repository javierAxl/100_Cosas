<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Ashley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="cloud" style="top:10%;animation-delay:-10s" aria-hidden="true"></div>
<div class="cloud" style="top:34%;animation-delay:-42s;scale:.7" aria-hidden="true"></div>
<div class="cloud" style="top:70%;animation-delay:-25s;scale:.85" aria-hidden="true"></div>

<main id="scene">
  <div class="contenedor">

    <!-- Gatito decorativo -->
    <svg class="mascota" viewBox="0 0 200 120" aria-hidden="true">
      <path d="M50 74 L56 26 L90 52 Z" fill="#f7a3c4"/>
      <path d="M150 74 L144 26 L110 52 Z" fill="#f7a3c4"/>
      <path d="M60 62 L62 40 L78 54 Z" fill="#ffc4da"/>
      <path d="M140 62 L138 40 L122 54 Z" fill="#ffc4da"/>
      <ellipse cx="100" cy="86" rx="58" ry="48" fill="#f7a3c4"/>
      <g class="eyes" fill="#5a2e4a">
        <circle cx="76" cy="86" r="7"/><circle cx="124" cy="86" r="7"/>
        <circle cx="78" cy="83" r="2.4" fill="#fff"/><circle cx="126" cy="83" r="2.4" fill="#fff"/>
      </g>
      <ellipse cx="58" cy="104" rx="11" ry="6" fill="#ff8fb5" opacity=".55"/>
      <ellipse cx="142" cy="104" rx="11" ry="6" fill="#ff8fb5" opacity=".55"/>
      <path d="M94 98 h12 l-6 7z" fill="#e86a9a"/>
      <path d="M100 105 q-6 8 -13 4 M100 105 q6 8 13 4" fill="none" stroke="#5a2e4a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M40 96 l-18 -4 M40 104 l-18 4 M160 96 l18 -4 M160 104 l18 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M92 42 q8 -12 16 0 q-8 6 -16 0z" fill="#e86a9a"/>
    </svg>

    <!-- INICIO -->
    <section id="inicio">
      <h1>Hola Ashley</h1>
      <h2>¿Cómo estás?</h2>

      <div class="botones">
        <button class="btn" data-resp="bien">Bien</button>
        <button class="btn" data-resp="normal">Normal</button>
        <button class="btn" data-resp="mal">No muy bien</button>
      </div>

      <div id="mensaje" aria-live="polite"></div>

      <button class="btn grande" id="continuar" hidden>Tengo algo para ti</button>
    </section>

    <!-- JUEGO -->
    <section id="juego" hidden>
      <h1>100 cosas que me gustan de ti</h1>

      <div class="numero" id="numero">0 / 100</div>
      <div id="barra"><i id="relleno"></i></div>

      <div class="cosa" id="cosa">Presiona el botón para comenzar</div>

      <button class="btn grande" id="siguiente">Siguiente</button>

      <div id="final" hidden>
        Ya llegamos a las 100.
        <br><br>
        Y aun así, siento que me faltan muchas más.
      </div>

      <div class="historial">
        <h3>Historial de este intento</h3>
        <ol id="listaHistorial"></ol>
      </div>
    </section>

  </div>
</main>

<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
